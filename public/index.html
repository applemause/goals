<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>Путь — цели</title>
    <link rel="stylesheet" href="/styles.css?v=20260812-3" />
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <template id="goal-form-template">
      <form class="form goal-form">
        <label>Название<input name="title" maxlength="90" placeholder="Например, Немецкий B2" required /></label>
        <label>Тип<select name="goalType"><option value="journey">Путь</option><option value="record">Рекорд</option><option value="collection">Коллекция</option><option value="custom">Свой</option></select></label>
        <div class="form-grid"><label>Сейчас<input name="currentValue" maxlength="60" placeholder="A2" required /></label><label>Цель<input name="targetValue" maxlength="60" placeholder="B2" required /></label></div>
        <label>Подпись<input name="meta" maxlength="160" placeholder="Курс 18 из 25 · ≈ 7 месяцев" /></label>
        <div class="form-actions"><button class="button button-primary" type="submit">Сохранить</button><button class="button button-quiet" type="button" data-close>Отмена</button></div>
      </form>
    </template>
    <script type="module" src="/app.js?v=20260812-3"></script>
  </body>
</html>
